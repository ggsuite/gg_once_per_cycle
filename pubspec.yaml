name: gg_once_per_cycle
description: Use GgOncePerCycle to trigger tasks multiple times while ensuring they are only executed one time during a run loop cycle.
version: 1.3.6
repository: https://github.com/inlavigo/gg_once_per_cycle

environment:
  sdk: ">=3.13.0 <4.0.0"

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
  fake_async: ^1.3.3
  args: ^2.7.0
  gg_capture_print: ^1.1.0